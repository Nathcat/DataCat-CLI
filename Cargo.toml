[package]
name = "clicat"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "A command line utility for the DataCat API."

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures = "0.3.34"
json-colorizer = "0.1.2"
readpass = "1.2.0"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"
