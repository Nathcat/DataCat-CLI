name: Publish

on:
  release:
    types: published

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rust:latest
      
    steps:
    - uses: actions/checkout@v4
    - name: Publish
      run: cargo publish
      env: 
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_PUBLISH_API_KEY }}
